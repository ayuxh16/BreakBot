services:
  - type: web
    name: breakbot-api
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /domains
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: breakbot-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
databases:
  - name: breakbot-db
    plan: free